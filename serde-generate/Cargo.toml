[package]
name = "serde-generate"
version = "0.34.0"
description = "Library to generate (de)serialization code in multiple languages"
documentation = "https://docs.rs/serde-generate"
repository = "https://github.com/zefchain/serde-reflection"
authors = ["Mathieu Baudet <mathieu.baudet@zefchain.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["data-structures", "serialization", "serde"]
categories = ["encoding", "development-tools"]
edition = "2021"
rust-version = "1.85.0"
exclude = [
    # Readme template that doesn't need to be included.
    "README.tpl",
]
autotests = false

[dependencies]
anyhow = "1.0.95"
heck = "0.5.0"
include_dir = { version = "0.7.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
textwrap = "0.16.2"
phf = { version = "0.13.1", features = ["macros"], optional = true }
serde-reflection = { path = "../serde-reflection", version = "0.6.0" }

[dev-dependencies]
alloy-sol-types = "1.6"
hex = "0.4.3"
regex = "1.12"
tempfile = "3.27"
which = "8.0"
serde_bytes = "0.11"
serde-saphyr = "0.0.28"
similar-asserts = "2.0.0"
bincode = "1.3.3"
bcs = "0.2.1"
maplit = "1.0.2"
revm = { version = "41.0.0", default-features = false, features = ["std", "secp256k1", "portable"] }
serde_json = "1.0"

[features]
default = ["cpp", "csharp", "dart", "golang", "java", "kotlin", "ocaml", "python3", "rust", "swift"]
cpp = []
csharp = ["include_dir"]
dart = ["include_dir"]
golang = []
java = ["include_dir"]
kotlin = ["include_dir"]
ocaml = ["phf", "include_dir"]
python3 = []
rust = []
# Note: the "solidity" feature requires Rust 1.88+ due to revm and alloy-eip* dev-dependencies.
solidity = ["phf"]
swift = ["include_dir"]
typescript = ["include_dir"]

[[test]]
name = "integration_tests"
path = "tests/lib.rs"
harness = true
